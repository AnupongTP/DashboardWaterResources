<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>แดชบอร์ด – กว๊านกักเก็บ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@600;700&family=Sarabun:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ธีมเดียวกับแดชบอร์ด (site/assets/dashboard-theme.css) */
  :root {
    --brand-start:#2a1d7a; --brand-mid:#4b34c8; --brand-end:#2f6fed;
    --canvas:#f2f0ff; --surface:#fff; --border:#e4e0fb; --ink:#1c1b4b; --muted:#6b6893;
    --accent:#4b34c8; --accent-soft:#efeaff; --radius:18px; --shadow:0 8px 24px rgba(61,42,170,.08);
  }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; color:var(--ink); font-family:'Sarabun',sans-serif; background-color:var(--canvas);
    background-image:radial-gradient(ellipse at 0 0,#ebe5ff 0,transparent 55%),radial-gradient(ellipse at 100% 0,#e5efff 0,transparent 45%);
    display:flex; flex-direction:column; align-items:center; }
  .app-header { width:100%; padding:18px 20px 22px; color:#fff;
    background:radial-gradient(circle at 92% 0,rgba(255,255,255,.14) 0 56px,transparent 57px),
      linear-gradient(115deg,var(--brand-start),var(--brand-mid) 55%,var(--brand-end));
    box-shadow:0 8px 24px rgba(61,42,170,.2); }
  .app-header .eyebrow { margin:0; font-family:'Prompt','Sarabun',sans-serif; font-weight:700; font-size:1.15rem; line-height:1.35; }
  .app-header .tagline { margin:2px 0 0; color:#e5e0ff; font-size:.78rem; letter-spacing:.03em; }
  main { width:calc(100% - 32px); max-width:460px; margin:-10px 16px 0; background:var(--surface); border:1px solid var(--border);
    border-radius:var(--radius); padding:22px 20px; box-shadow:var(--shadow); position:relative; }
  main::before { content:""; position:absolute; left:18px; right:18px; top:0; height:4px; border-radius:0 0 4px 4px;
    background:linear-gradient(90deg,#2f6fed,#7c5cf0,#22c3a6,#f59e0b,#ef4f7a); }
  .title { display:flex; align-items:center; gap:10px; margin:6px 0 4px; }
  .chip { width:38px; height:38px; flex:none; border-radius:12px; display:grid; place-items:center; font-size:1.1rem;
    background:linear-gradient(135deg,#6d4ff0,#4b34c8); box-shadow:0 6px 14px rgba(75,52,200,.3); }
  h1 { margin:0; font-size:1.3rem; font-weight:800; color:var(--ink); }
  .sub { margin:0 0 16px 48px; color:var(--muted); font-size:.95rem; }
  .current { margin:0 0 16px; padding:10px 14px; border-radius:999px; background:var(--accent-soft); color:var(--accent);
    font-weight:700; text-align:center; }
  label { display:block; font-weight:700; margin-bottom:6px; color:var(--muted); font-size:.95rem; }
  input { width:100%; font:inherit; font-size:1.15rem; padding:12px 16px; background:#f8f7ff; border:1px solid var(--border);
    border-radius:14px; color:var(--ink); text-transform:uppercase; letter-spacing:.04em; }
  input::placeholder { text-transform:none; letter-spacing:0; color:#a7a3c7; }
  button { width:100%; font:inherit; font-size:1.05rem; font-weight:700; padding:13px; border-radius:999px; cursor:pointer; margin-top:12px; }
  .primary { color:#fff; border:0; background:linear-gradient(115deg,var(--brand-mid),var(--brand-end)); box-shadow:0 8px 18px rgba(75,52,200,.25); }
  .general { background:#fff; color:var(--accent); border:1.5px solid var(--accent); }
  .link { background:none; border:0; color:var(--muted); text-decoration:underline; font-weight:400; font-size:.95rem; }
  :is(button,input):focus-visible { outline:3px solid #7c5cf0; outline-offset:3px; }
  button:disabled { opacity:.55; cursor:default; }
  .divider { display:flex; align-items:center; gap:10px; color:var(--muted); margin:18px 0 0; font-size:.9rem; }
  .divider::before, .divider::after { content:""; flex:1; height:1px; background:var(--border); }
  #message { min-height:1.5em; margin:14px 0 0; text-align:center; font-weight:700; }
  #message.error { color:#d6336c; } #message.ok { color:#16a37b; }
  #status { text-align:center; font-weight:700; color:var(--accent); margin:6px 0; }
  footer { margin:16px; color:var(--muted); font-size:.8rem; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header class="app-header">
  <p class="eyebrow">กว๊านกักเก็บ แดชบอร์ดศูนย์ข้อมูลแหล่งน้ำ จังหวัดพะเยา</p>
  <p class="tagline">KwanKukkeb – Phayao Water Resources Data Center Dashboard</p>
</header>
<main>
  <p id="status" role="status">กำลังเปิดแดชบอร์ดของคุณ…</p>


  <section id="chooseView" hidden>
    <div class="title"><span class="chip" aria-hidden="true">📍</span><h1>เลือกการใช้งาน</h1></div>
    <p class="sub">เปิดแดชบอร์ดตามพื้นที่ของคุณ</p>
    <p class="current" id="current" hidden></p>
    <form id="codeForm">
      <label for="code">เจ้าหน้าที่: กรอกรหัสพื้นที่</label>
      <input id="code" name="code" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="เช่น TT-MAEKA" required>
      <button type="submit" class="primary" id="submitBtn">ยืนยัน</button>
    </form>
    <p class="divider">หรือ</p>
    <button type="button" class="general" id="generalBtn">ใช้งานทั่วไป (ดูภาพรวมจังหวัด)</button>
    <button type="button" class="link" id="cancelBtn" hidden></button>
    <p id="message" role="status" aria-live="polite"></p>
  </section>
</main>
<footer id="userId" hidden></footer>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js" charset="utf-8"></script>
<script src="/line/line-config.js"></script>
<script>
(function () {
  'use strict';
  const PROVINCE = '/';
  const TIMEOUT_MS = 8000;
  const cfg = window.LINE_LIFF || {};
  const $ = (id) => document.getElementById(id);

  function go(url) { location.replace(url); }

  // ID token หมดอายุ (401): logout แล้ว login ใหม่ 1 ครั้ง กันวนลูปด้วย ?relogin=1
  // ในแอป LINE ใช้ liff.login() ไม่ได้ → logout แล้วโหลดหน้าใหม่ให้ liff.init() ออก token ใหม่เอง
  function relogin() {
    const url = new URL(location.href);
    if (url.searchParams.get('relogin') === '1') return false;
    url.searchParams.set('relogin', '1');
    setTimeout(() => go(PROVINCE), TIMEOUT_MS);
    liff.logout();
    if (liff.isInClient()) location.replace(url.href);
    else liff.login({ redirectUri: url.href });
    return true;
  }

  // ID token ต้องมีและยังไม่หมดอายุ ก่อนเรียก API
  function freshToken() {
    const token = liff.getIDToken();
    const decoded = token && liff.getDecodedIDToken();
    if (!token || !decoded || decoded.exp * 1000 <= Date.now()) {
      console.warn('LIFF ID token missing or expired');
      return false;
    }
    return true;
  }

  function withTimeout(promise, ms) {
    return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), ms))]);
  }

  async function api(path, options, timeoutMs) {
    const controller = new AbortController();
    const timer = timeoutMs ? setTimeout(() => controller.abort(), timeoutMs) : null;
    try {
      const res = await fetch(path, {
        ...options,
        headers: { Authorization: 'Bearer ' + liff.getIDToken(), 'Content-Type': 'application/json' },
        signal: controller.signal
      });
      const body = await res.json().catch(() => ({}));
      return { status: res.status, body };
    } finally {
      if (timer) clearTimeout(timer);
    }
  }

  function showOnly(view) {
    $('status').hidden = true;
    $('chooseView').hidden = view !== 'choose';
  }

  function message(text, kind) {
    $('message').textContent = text;
    $('message').className = kind || '';
  }

  function busy(on) {
    ['submitBtn', 'generalBtn'].forEach((id) => { $(id).disabled = on; });
  }

  function showChoose(current) {
    showOnly('choose');
    message('');
    busy(false);
    const currentEl = $('current');
    const cancel = $('cancelBtn');
    if (current) {
      currentEl.textContent = 'พื้นที่ปัจจุบัน: ' + current.name;
      currentEl.hidden = false;
      cancel.textContent = 'ไม่เปลี่ยน กลับไปที่ ' + current.name;
      cancel.hidden = false;
      cancel.onclick = () => go(current.url);
    } else {
      currentEl.hidden = true;
      cancel.hidden = true;
    }
  }

  function errorText(result) {
    if (result.body && result.body.error === 'invalid_code') return 'ไม่พบรหัสพื้นที่นี้ กรุณาตรวจสอบหรือติดต่อทีมจังหวัด';
    return 'เกิดข้อผิดพลาด กรุณาลองใหม่';
  }

  async function submit(payload) {
    if (!freshToken() && relogin()) return;
    busy(true);
    message('กำลังบันทึก…');
    try {
      const result = await api('/api/line/register', { method: 'POST', body: JSON.stringify(payload) }, TIMEOUT_MS);
      if (result.status === 401 && relogin()) return;
      if (result.status === 200 && result.body.ok) {
        message('บันทึกแล้ว กำลังเปิด ' + result.body.name + '…', 'ok');
        go(result.body.url);
        return;
      }
      message(errorText(result), 'error');
    } catch (error) {
      message('เกิดข้อผิดพลาด กรุณาลองใหม่', 'error');
    }
    busy(false);
  }

  function showUserId() {
    try {
      const sub = (liff.getDecodedIDToken() || {}).sub || '';
      if (sub.length > 6) {
        $('userId').textContent = 'รหัสผู้ใช้: ' + sub.slice(0, 4) + '…' + sub.slice(-2);
        $('userId').hidden = false;
      }
    } catch (error) { /* ไม่แสดงรหัสผู้ใช้ได้ ไม่กระทบการใช้งาน */ }
  }

  async function start() {
    if (!cfg.myId || typeof liff === 'undefined') return go(PROVINCE);
    await withTimeout(liff.init({ liffId: cfg.myId }), TIMEOUT_MS);
    if (!liff.isLoggedIn()) {
      liff.login({ redirectUri: location.href });
      return;
    }
    if (!freshToken()) {
      if (!relogin()) go(PROVINCE);
      return;
    }
    showUserId();
    // ปุ่ม "ตั้งค่าพื้นที่" ในริชเมนูเปิด LIFF ด้วย ?change=1 (อ่านหลัง liff.init เพราะ LIFF คืน query ให้หลัง init)
    const changeMode = new URLSearchParams(location.search).get('change') === '1';
    const me = await api('/api/line/me', { method: 'GET' }, TIMEOUT_MS);
    if (me.status === 401 && relogin()) return;
    if (me.status !== 200) return go(PROVINCE);
    if (me.body.registered && me.body.url && !changeMode) return go(me.body.url);
    showChoose(me.body.registered ? me.body : null);
  }

  $('codeForm').addEventListener('submit', (event) => {
    event.preventDefault();
    const code = $('code').value.trim();
    if (!code) { message('กรุณากรอกรหัสพื้นที่', 'error'); return; }
    submit({ code: code });
  });
  $('generalBtn').addEventListener('click', () => submit({ mode: 'general' }));

  start().catch(() => go(PROVINCE));
})();
</script>
</body>
</html>
